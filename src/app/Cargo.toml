[package]
name = "app"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The one binary. Named `distro` rather than `app` because it is what a user
# types; the crate keeps the layout name the canvas gives it (§4, D9).
[[bin]]
name = "distro"
path = "src/main.rs"

# `app` depends on everything and nothing depends on `app` (canvas §4).
#
# `infra-sim-net` is deliberately absent, and its absence is load-bearing: the
# simulator is test infrastructure with a virtual clock and an in-process
# fabric, and a production binary that could link it could ship a build whose
# "network" was a `HashMap`. Canvas OP-8: "Never linked into the `app` binary."
[dependencies]
shared-types.workspace = true
identity.workspace = true
membership.workspace = true
messaging.workspace = true
infra-net-libp2p.workspace = true
infra-store-fs.workspace = true

# D8: the terminal UI is the only frontend. `ratatui` re-exports the terminal
# backend it was built against, so `crossterm` is reached through
# `ratatui::crossterm` rather than declared separately — two independently
# versioned copies of one terminal library is a class of bug worth deleting.
ratatui = "0.30"

# The OSC 52 clipboard payload (canvas `0013`, D9/D11). Already compiled for
# `infra-net-libp2p`, so this is one more edge in the graph rather than one more
# crate — and hand-rolling an encoder for a string users paste between machines
# would be a correctness risk bought with nothing.
base64.workspace = true

[lints]
workspace = true
