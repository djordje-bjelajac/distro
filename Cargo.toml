[workspace]
resolver = "3"
members = [
    "src/shared_types",
    "src/contexts/identity",
    "src/contexts/membership",
    "src/contexts/messaging",
    "src/infrastructure/net_libp2p",
    "src/infrastructure/store_fs",
    "src/infrastructure/sim_net",
    "src/app",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
shared-types = { path = "src/shared_types" }
identity = { path = "src/contexts/identity" }
membership = { path = "src/contexts/membership" }
messaging = { path = "src/contexts/messaging" }
infra-net-libp2p = { path = "src/infrastructure/net_libp2p" }
infra-store-fs = { path = "src/infrastructure/store_fs" }
infra-sim-net = { path = "src/infrastructure/sim_net" }

ed25519-dalek = "2"
getrandom = "0.2"
sha2 = "0.10"
# Two crates encode base64 now: `infra-net-libp2p` for the join-ticket string
# and `app` for the OSC 52 clipboard payload that carries it. One version, so
# a ticket cannot be encoded by one alphabet and decoded by another.
base64 = "0.22.1"

[workspace.lints.rust]

[workspace.lints.clippy]
